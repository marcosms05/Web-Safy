<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/safy-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SAFY — La primera app de navegación que prioriza tu seguridad con datos reales del INE y de la comunidad." />
    <meta property="og:title" content="SAFY — Navegación Segura" />
    <meta property="og:description" content="Rutas inteligentes calculadas con incidencias en tiempo real y estadísticas del Instituto Nacional de Estadística." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#0e1012" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <title>SAFY — Navegación Segura</title>
  <style>
      /* --- Global page setup --- */
      body {
        margin: 0;
        background-color: #0e1012; /* Evita flash blanco */
      }

      /* --- Preloader --- */
      .preloader {
        position: fixed;
        inset: 0;
        background-color: #0e1012;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 9999;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }
      .preloader.loaded {
        opacity: 0;
        pointer-events: none; /* Asegura que no interfiera con clics */
      }
      
      .preloader .logo-loader {
        width: 100px;
        height: auto;
        animation: pulse 2s infinite ease-in-out;
      }

      /* Spinner animado */
      .preloader .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #334155; /* slate-700 */
        border-top-color: #04cddd; /* signal */
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes pulse {
        0%, 100% {
          opacity: 0.85;
          transform: scale(1);
        }
        50% {
          opacity: 1;
          transform: scale(1.05);
        }
      }
    </style>
  </head>
  <body>
    <!-- --- Preloader --- -->
    <div id="preloader" class="preloader">
      <img src="/safy-logo.svg" alt="Logo de SAFY" class="logo-loader" />
      <div class="spinner"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
